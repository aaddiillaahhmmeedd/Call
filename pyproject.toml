[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netlist-agent"
version = "0.2.0"
description = "PCB toolkit: netlisting, ratsnest, placement, routing, DRC, and fabrication outputs"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
netlist-agent = "netlist_agent.cli:main"

[tool.setuptools.packages.find]
include = ["netlist_agent*"]

[tool.setuptools.package-data]
netlist_agent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
